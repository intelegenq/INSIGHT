# Insight M30 — reproducible full-stack deployment
#
#   postgres  → primary relational store (snapshots, entities)
#   redis     → cache / queue
#   minio     → S3-compatible artifact storage (reports, evidence)
#   web       → Next.js frontend (built from the monorepo)
#   worker    → scheduled refresh worker loop
#
# Bring up the full stack with:
#   docker compose up --build
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: insight
      MINIO_ROOT_PASSWORD: insightsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # M30: Next.js web app — serves the dashboard, API routes, and UI.
  # Connects to the same Postgres/Redis/MinIO as the worker so
  # worker-persisted snapshots are visible to API routes.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web-runner
    ports:
      - "3000:3000"
    environment:
      INSIGHT_POSTGRES_URL: postgresql://insight:insight@postgres:5432/insight
      INSIGHT_REDIS_URL: redis://redis:6379
      INSIGHT_S3_ENDPOINT: http://minio:9000
      INSIGHT_S3_BUCKET: insight-artifacts
      # Live provider credentials — supply via .env or docker secrets.
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      # AI Assistant (M31)
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # M29: ingestion worker — wires live providers to RefreshEngine + WorkerRunner.
  # Real drivers resolve when INSIGHT_POSTGRES_URL/INSIGHT_REDIS_URL are set.
  # Provider credentials (HELIUS_API_KEY, SOLANA_RPC_URL) enable live data ingestion.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker-runner
    environment:
      INSIGHT_POSTGRES_URL: postgresql://insight:insight@postgres:5432/insight
      INSIGHT_REDIS_URL: redis://redis:6379
      INSIGHT_S3_ENDPOINT: http://minio:9000
      INSIGHT_S3_BUCKET: insight-artifacts
      INSIGHT_WORKER_INTERVAL_MS: "300000"
      INSIGHT_WORKER_MAX_FAILURES: "10"
      # Live provider credentials — supply via .env or docker secrets.
      # When absent, worker falls back to demo data gracefully.
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
